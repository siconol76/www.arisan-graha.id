<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Laporan Kas – Arisan Semeton Graha Tirta</title>

    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
      body {
        font-family: Arial;
        background: #f4f6f8;
        padding: 20px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 15px;
        background: #0f172a;
        color: #fff;
        padding: 15px;
        border-radius: 10px;
      }
      header h1 {
        margin: 0;
        font-size: 22px;
      }
      .menu {
        margin-left: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin: 20px 0;
      }
      .grid div {
        background: #fff;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 6px;
        font-size: 13px;
        text-align: center;
      }
      th {
        background: #e5e7eb;
      }
      input,
      textarea,
      select {
        width: 100%;
        box-sizing: border-box;
        font-size: 13px;
      }
      textarea {
        resize: vertical;
      }
      button {
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      .danger {
        background: #dc2626;
      }
      .print-header,
      .ttd-area {
        display: none;
      }
      @media print {
        header,
        .menu,
        .no-print {
          display: none !important;
        }
        .print-header,
        .ttd-area {
          display: flex !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- LOGIN -->
    <div
      id="loginBox"
      style="
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
      "
    >
      <div
        style="
          background: #fff;
          padding: 30px;
          border-radius: 12px;
          width: 300px;
          text-align: center;
        "
      >
        <h3>Login Sistem Kas</h3>
        <input id="loginUser" placeholder="Username" /><br /><br />
        <input
          id="loginPass"
          type="password"
          placeholder="Password"
        /><br /><br />
        <button onclick="login()">Login</button>
        <p id="loginErr" style="color: red"></p>
      </div>
    </div>

    <header>
      <div style="display: flex; align-items: center; gap: 15px">
        <img src="logo.png" style="height: 60px" />
        <div>
          <h1>ARISAN SEMETON GRAHA TIRTA</h1>
          <small>Laporan Kas Masuk & Keluar</small>
        </div>
      </div>
      <div class="menu no-print">
        <span id="userInfo"></span>
        <button id="adminMenuBtn" style="display: none">Data Anggota</button>
        <button onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="grid">
      <div>
        <h3>Kas Arisan</h3>
        <div id="saldo101">Rp 0</div>
      </div>
      <div>
        <h3>Kas Suka Duka</h3>
        <div id="saldo103">Rp 0</div>
      </div>
      <div>
        <h3>Kas Kecil</h3>
        <div id="saldo102">Rp 0</div>
      </div>
      <div>
        <h3>Total</h3>
        <div id="saldoTotal">Rp 0</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Kode</th>
          <th>Akun</th>
          <th>Keterangan</th>
          <th>Debet</th>
          <th>Kredit</th>
          <th>Saldo</th>
        </tr>
      </thead>
      <tbody id="kasBody"></tbody>
    </table>
    <br />

    <div class="no-print">
      <button onclick="tambahKas()">➕ Tambah</button>
      <button onclick="simpanSemua()">💾 Simpan Semua</button>
      <button onclick="window.print()">🖨️ Export PDF</button>
    </div>

    <!-- PRINT HEADER -->
    <div
      class="print-header"
      style="align-items: center; gap: 15px; margin-top: 40px"
    >
      <img src="logo.png" style="height: 70px" />
      <div>
        <h2>ARISAN SEMETON GRAHA TIRTA</h2>
        <small>Laporan Kas</small>
      </div>
    </div>

    <!-- TTD DIGITAL -->
    <div
      class="ttd-area"
      style="justify-content: space-between; margin-top: 60px"
    >
      <div style="text-align: center">
        <div>Ketua</div>
        <br />
        <img id="ttdKetuaImg" style="height: 80px" /><br />
        <strong id="ttdKetuaText"></strong>
      </div>
      <div style="text-align: center">
        <div>Bendahara</div>
        <br />
        <img id="ttdBendaharaImg" style="height: 80px" /><br />
        <strong id="ttdBendaharaText"></strong>
      </div>
    </div>

    <script>
      // ===== FIREBASE INIT =====
      const firebaseConfig = {
        apiKey: "ISI_API_KEY",
        databaseURL: "https://ISI_PROJECT.firebaseio.com",
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      // ===== AUTH =====
      const users = {
        admin: { pass: "12345", role: "admin" },
        ketua: { pass: "12345", role: "ketua" },
        viewer: { pass: "12345", role: "viewer" },
      };
      let currentUser = null;

      function canEdit() {
        return (
          currentUser &&
          (currentUser.role === "admin" || currentUser.role === "ketua")
        );
      }

      function login() {
        const u = loginUser.value;
        const p = loginPass.value;
        if (users[u] && users[u].pass === p) {
          currentUser = { user: u, role: users[u].role };
          localStorage.setItem("currentUser", JSON.stringify(currentUser));
          loginBox.style.display = "none";
          init();
        } else loginErr.innerText = "Login salah";
      }

      function logout() {
        localStorage.removeItem("currentUser");
        location.reload();
      }

      // ===== DATA =====
      let kasData = [];
      const akunMap = { 101: "Kas Arisan", 102: "Kas Kecil", 103: "Suka Duka" };

      const saved = localStorage.getItem("currentUser");
      if (saved) {
        currentUser = JSON.parse(saved);
        loginBox.style.display = "none";
        init();
      }

      function init() {
        userInfo.innerText = currentUser.user + " (" + currentUser.role + ")";

        // MENU ADMIN HANYA UNTUK ADMIN
        if (currentUser.role === "admin") {
          adminMenuBtn.style.display = "inline-block";
          if (typeof loadAnggota === "function") loadAnggota();
        } else {
          adminMenuBtn.style.display = "none";
        }

        db.ref("kasData").on("value", (s) => {
          kasData = s.val() || [];
          renderKas();
        });
      }

      // ===== KAS =====
      function tambahKas() {
        if (!canEdit()) return;
        kasData.push({
          tanggal: new Date().toISOString().slice(0, 10),
          kode: 101,
          ket: "",
          debet: 0,
          kredit: 0,
        });
        renderKas();
      }
      function simpanSemua() {
        if (!canEdit()) return;
        db.ref("kasData")
          .set(kasData)
          .then(() => alert("Tersimpan"));
      }

      function renderKas() {
        kasBody.innerHTML = "";
        let saldo = { 101: 0, 102: 0, 103: 0 };
        kasData.forEach((k, i) => {
          saldo[k.kode] += k.debet - k.kredit;
          const dis = canEdit() ? "" : "disabled";
          kasBody.innerHTML += `<tr>
      <td><input type="date" ${dis} value="${
            k.tanggal
          }" onchange="kasData[${i}].tanggal=this.value"></td>
      <td>
        <select ${dis} onchange="kasData[${i}].kode=Number(this.value); renderKas();">
          <option value="101" ${k.kode == 101 ? "selected" : ""}>101</option>
          <option value="102" ${k.kode == 102 ? "selected" : ""}>102</option>
          <option value="103" ${k.kode == 103 ? "selected" : ""}>103</option>
        </select>
      </td>
      <td><strong>${akunMap[k.kode]}</strong></td>
      <td><textarea rows="1" ${dis} onchange="kasData[${i}].ket=this.value">${
            k.ket || ""
          }</textarea></td>
      <td><input type="number" ${dis} value="${
            k.debet
          }" onchange="kasData[${i}].debet=Number(this.value)"></td>
      <td><input type="number" ${dis} value="${
            k.kredit
          }" onchange="kasData[${i}].kredit=Number(this.value)"></td>
      <td>${saldo[k.kode].toLocaleString("id-ID")}</td>
    </tr>`;
        });
        saldo101.innerText = "Rp " + saldo[101].toLocaleString("id-ID");
        saldo102.innerText = "Rp " + saldo[102].toLocaleString("id-ID");
        saldo103.innerText = "Rp " + saldo[103].toLocaleString("id-ID");
        saldoTotal.innerText =
          "Rp " +
          (saldo[101] + saldo[102] + saldo[103]).toLocaleString("id-ID");
      }
    </script>
  </body>
</html>
